name: Verify generated data

# Downloads the official sources, checks their SHA-256 and regenerates the
# taxonomy data; fails if src/data differs from what the sources give.
# Runs on demand and on pull requests that touch the data or the generator.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/data/**'
      - 'python/src/roster/data/**'
      - 'scripts/**'
      - 'test-vectors/**'

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run sources:fetch
      - run: npm run taxonomy:generate && npm run vectors:generate && npm run docs:coverage
      - run: cmp src/data/dora-4.0.json python/src/roster/data/dora-4.0.json
      - run: git diff --exit-code
