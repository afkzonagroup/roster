name: Release

# Publishes to npm with provenance through npm trusted publishing (OIDC).
# No npm token is stored in the repository. Runs when a GitHub release is published, or manually.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=low
      # .npmrc sets ignore-scripts=true, so "prepack" does not run: build explicitly
      # and refuse to publish a tarball without the compiled code.
      - run: npm run build
      - run: npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
      - run: node scripts/check-pack.mjs "$RUNNER_TEMP/pack.json"
      - run: npm publish --provenance --access public
